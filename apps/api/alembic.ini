# Verity API — Alembic configuration.
#
# sqlalchemy.url is intentionally left blank: migrations/env.py builds the
# connection URL from verity.core.config.get_settings() so the same
# VERITY_DATABASE_URL environment variable drives both the application and
# its migrations, and no connection string (with embedded credentials)
# lives in a checked-in file (Database.md §8, TechStack.md §7).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S